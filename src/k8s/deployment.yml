apiVersion: apps/v1
kind: Deployment
metadata:
  name: paycomputation-service
  labels:
    app: paycomputation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paycomputation-service
  template:
    metadata:
      labels:
        app: paycomputation-service
    spec:
      containers:
        - name: paycomputation-service
          image: kacytunde/paycomputation-service:1.9
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          ports:
            - containerPort: 9002
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9002
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9002
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          env:
            - name: BPL_JVM_THREAD_COUNT
              value: "100"
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-service
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: paycomputation-secrets
                  key: mongodb-uri
            - name: SPRING_DATA_MONGODB_DATABASE
              value: xykinehrsdb
            - name: SPRING_REDIS_HOST
              value: xykine-redis
            - name: SPRING_PROFILES_ACTIVE
              value: prod
